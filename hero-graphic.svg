<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" fill="none">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A24"/>
      <stop offset="100%" stop-color="#0F1017"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="270" cy="220" r="180" fill="url(#goldGlow)"/>

  <!-- Background Grid -->
  <path d="M40 80H500M40 140H500M40 200H500M40 260H500M40 320H500M40 380H500" stroke="#232736" stroke-width="1" stroke-dasharray="4 8"/>
  <path d="M100 40V400M180 40V400M260 40V400M340 40V400M420 40V400" stroke="#232736" stroke-width="1" stroke-dasharray="4 8"/>

  <!-- Main Tech Console Window -->
  <rect x="70" y="55" width="400" height="290" rx="16" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <circle cx="100" cy="85" r="5" fill="#EF4444"/>
  <circle cx="118" cy="85" r="5" fill="#F59E0B"/>
  <circle cx="136" cy="85" r="5" fill="#10B981"/>
  <rect x="170" y="77" width="200" height="16" rx="8" fill="#202332"/>
  <text x="210" y="89" fill="#9CA3AF" font-family="monospace" font-size="10">wallix.system/engine</text>

  <!-- Visual Panels inside Console -->
  <!-- Left Side: Code & AI Node -->
  <rect x="100" y="115" width="165" height="200" rx="10" fill="#11131B" stroke="#2E3347" stroke-width="1"/>
  <path d="M118 135L128 145L118 155" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <rect x="135" y="142" width="60" height="6" rx="3" fill="#F59E0B" fill-opacity="0.8"/>
  <rect x="118" y="170" width="110" height="6" rx="3" fill="#3B425A"/>
  <rect x="118" y="186" width="90" height="6" rx="3" fill="#3B425A"/>
  <rect x="118" y="202" width="125" height="6" rx="3" fill="#3B425A"/>
  <rect x="118" y="228" width="55" height="20" rx="6" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1"/>
  <text x="127" y="242" fill="#F59E0B" font-family="sans-serif" font-size="9" font-weight="700">AI CORE</text>
  <rect x="180" y="228" width="60" height="20" rx="6" fill="#202436"/>
  <text x="190" y="242" fill="#9CA3AF" font-family="sans-serif" font-size="9">STUDIO</text>

  <!-- Right Side: Graphic Metric & Graph -->
  <rect x="280" y="115" width="165" height="200" rx="10" fill="#11131B" stroke="#2E3347" stroke-width="1"/>
  <text x="295" y="140" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600">Digital Impact</text>
  <text x="295" y="156" fill="#9CA3AF" font-family="sans-serif" font-size="9">Brand Reach &amp; Web</text>
  
  <!-- Wave Graph -->
  <path d="M295 210C315 190 330 230 350 180C370 140 395 210 425 160" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="425" cy="160" r="4" fill="#F59E0B"/>
  <circle cx="350" cy="180" r="3" fill="#FFFFFF"/>
  <path d="M295 250H425" stroke="#232736" stroke-width="1"/>
  <rect x="295" y="270" width="35" height="26" rx="4" fill="#1A1E2C"/>
  <rect x="340" y="260" width="35" height="36" rx="4" fill="#F59E0B" fill-opacity="0.3" stroke="#F59E0B" stroke-width="1"/>
  <rect x="385" y="245" width="35" height="51" rx="4" fill="#F59E0B"/>

  <!-- Floating Badge 1: Innovation Hub -->
  <g transform="translate(330, 290)">
    <rect width="160" height="64" rx="12" fill="#151722" stroke="#F59E0B" stroke-width="1.5" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.5))"/>
    <circle cx="30" cy="32" r="16" fill="#F59E0B" fill-opacity="0.15"/>
    <path d="M25 32L29 36L36 28" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Digital Precision</text>
    <text x="56" y="44" fill="#9CA3AF" font-family="sans-serif" font-size="9.5">Creative Studio</text>
  </g>

  <!-- Floating Badge 2: Modern AI -->
  <g transform="translate(30, 230)">
    <rect width="145" height="54" rx="12" fill="#151722" stroke="#374151" stroke-width="1.5" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.5))"/>
    <circle cx="26" cy="27" r="14" fill="#232738"/>
    <path d="M22 27H30M26 23V31" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="700">AI Solutions</text>
    <text x="48" y="38" fill="#F59E0B" font-family="sans-serif" font-size="9">Smart Automation</text>
  </g>
</svg>
